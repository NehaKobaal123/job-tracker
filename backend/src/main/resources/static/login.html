<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobTrack — Sign in</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-brand">
      <div class="brand-mark">J</div>
      <span>JobTrack</span>
    </section>
    <section class="auth-card">
      <p class="eyebrow">YOUR CAREER DASHBOARD</p>
      <h1>Welcome back 👋</h1>
      <p class="muted">Track your applications, interviews and next opportunity.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" required placeholder="you@example.com"></label>
        <label>Password<input id="password" type="password" required placeholder="••••••••"></label>
        <button class="primary-btn" type="submit">Sign in</button>
        <p id="message" class="message"></p>
      </form>
      <p class="switch">New to JobTrack? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
