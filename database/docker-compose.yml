services:
  mysql:
    image: mysql:8.4
    container_name: jobtracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jobtracker
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - jobtracker_mysql:/var/lib/mysql

volumes:
  jobtracker_mysql:
